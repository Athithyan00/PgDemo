<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="arcnio-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="subtle-shadow" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#090e1a" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Squircle Tile Background -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#arcnio-bg)" />
  <rect x="2" y="2" width="60" height="60" rx="15" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1.5" />

  <!-- Ground Line -->
  <path d="M12 51.5H52" stroke="rgba(255, 255, 255, 0.65)" stroke-width="2" stroke-linecap="round" />

  <!-- Side Annex Wing -->
  <g filter="url(#subtle-shadow)">
    <rect x="36" y="23" width="14" height="28.5" rx="2" fill="#e0f2fe" />
    <rect x="40.5" y="27.5" width="5" height="4.5" rx="1" fill="#0284c7" />
    <rect x="40.5" y="34.5" width="5" height="4.5" rx="1" fill="#0284c7" />
    <rect x="40.5" y="41.5" width="5" height="4.5" rx="1" fill="#0284c7" />
  </g>

  <!-- Main Central Residency Tower -->
  <g filter="url(#subtle-shadow)">
    <!-- Tower Body -->
    <rect x="16" y="14" width="20" height="37.5" rx="2.5" fill="#ffffff" />
    
    <!-- Roof Antenna Indicator -->
    <path d="M26 14V8.5" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    <circle cx="26" cy="8" r="1.5" fill="#38bdf8" />

    <!-- Windows (Main Tower) -->
    <rect x="19.5" y="18" width="4.5" height="4.5" rx="1" fill="#0284c7" />
    <rect x="27.5" y="18" width="4.5" height="4.5" rx="1" fill="#0284c7" />

    <rect x="19.5" y="24.5" width="4.5" height="4.5" rx="1" fill="#0284c7" />
    <rect x="27.5" y="24.5" width="4.5" height="4.5" rx="1" fill="#0284c7" />

    <rect x="19.5" y="31" width="4.5" height="4.5" rx="1" fill="#0284c7" />
    <rect x="27.5" y="31" width="4.5" height="4.5" rx="1" fill="#0284c7" />

    <rect x="19.5" y="37.5" width="4.5" height="4.5" rx="1" fill="#0284c7" />
    <rect x="27.5" y="37.5" width="4.5" height="4.5" rx="1" fill="#0284c7" />

    <!-- Main Entryway (Doorway) -->
    <path d="M23 51.5V45C23 44.17 23.67 43.5 24.5 43.5H27.5C28.33 43.5 29 44.17 29 45V51.5H23Z" fill="#1e3a8a" />
  </g>

  <!-- Smart Online / Verified Status Dot -->
  <circle cx="50" cy="14" r="3.5" fill="#10b981" stroke="#ffffff" stroke-width="1.5" />
</svg>
